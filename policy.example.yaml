# cam-guard — example policy (nudity only).
# Validated by the test suite, so what you read here is what the engine accepts.
#
# Child-presence detection is optional and off here: it needs the separate
# @cam-guard/detector-minor package and much more CPU. See
# examples/policy.with-children.yaml.

version: 1

# Rules are shared across profiles through YAML anchors.
x-rules:
  explicit-nudity: &explicit-nudity
    id: explicit-nudity
    labels:
      - FEMALE_GENITALIA_EXPOSED
      - MALE_GENITALIA_EXPOSED
      - ANUS_EXPOSED
      - FEMALE_BREAST_EXPOSED
      - BUTTOCKS_EXPOSED
    minArea: 0.002            # ignore boxes smaller than 0.2% of the frame
    consecutiveFrames: 3      # three frames in a row before anything fires
    rearmAfter: 60s
    # A first hint (≥ 0.4) makes the scheduler sample this user every few
    # seconds for 2 minutes, so the three frames arrive quickly.
    watch:
      threshold: 0.4
      for: 2m
    report:
      threshold: 0.6
      actions: [report]
    act:
      threshold: 0.85
      window: 24h             # offences within 24 h escalate
      steps:
        # 1st offence: close the camera and warn
        - - report
          - close_cam
          - type: warn
            message: "La tua webcam è stata chiusa: in questa stanza il nudo non è consentito."
        # 2nd offence (and any later one) within 24 h: kick and suspend
        - - report
          - type: kick
            message: "Nudo ripetuto in una stanza dove non è consentito."
          - type: suspend
            hours: 24
            message: "Nudo ripetuto in una stanza dove non è consentito."
        # A permanent ban is never automatic: moderators decide from the dashboard.

profiles:
  strict:
    rules:
      - *explicit-nudity

  # Rooms where nudity between adults is allowed: only report it, never act.
  adults:
    rules:
      - <<: *explicit-nudity
        report:
          threshold: 0.85
          actions: [report]
        act: null

rooms:
  default: strict
  overrides:
    "adults-*": adults
    "test-room": "off"

memory:
  idleTtl: 48h
